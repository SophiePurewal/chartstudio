name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run production checks
        run: bun run check

      - name: Upload verified Figma build
        uses: actions/upload-artifact@v7
        with:
          name: chartstudio-figma-plugin
          path: |
            dist/code.js
            dist/ui.html
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14
