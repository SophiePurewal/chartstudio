name: Release Figma plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run production checks
        run: bun run check

      - name: Package Figma plugin
        run: |
          cd dist
          zip -r ../chartstudio-figma-plugin.zip code.js ui.html manifest.json

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: chartstudio-figma-plugin
          path: chartstudio-figma-plugin.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" chartstudio-figma-plugin.zip --generate-notes
